name: beal-b01-o1-conductor-bridge

on:
  push:
    branches:
      - attack/beal-b01-o1-conductor-bridge-20260926
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select isolated B01 toolchain
        run: echo 'leanprover/lean4:v4.30.0' > lean-toolchain
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
      - name: Build B01 O1 conductor bridge
        run: |
          set -euo pipefail
          cp lakefile.toml lakefile.canonical.toml
          cat >> lakefile.toml <<'EOF'
          
          [[require]]
          name = "mathlib"
          git = "https://github.com/leanprover-community/mathlib4.git"
          rev = "v4.30.0"
          EOF
          rm -f lake-manifest.json
          lake update
          lake build MCore.B01DenseScientificFrontier
          lake build MCore.B01O1ConductorBridge
          lake build MCore.BealUnifiedClosureRouter
          lake build MCore.BealUnconditionalClaimCertificate
          lake build MCore.BealUnconditionalClaimAttack
          lake build MCore.BealF6Exclusion
          lake build MCore.BealHabitant
          lake build MCore.BealFiveFamilyAttack
          if grep -n -E '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' lean/MCore/B01O1ConductorBridge.lean; then exit 1; fi
          if grep -n -E '^[[:space:]]*(axiom|constant|constants)[[:space:]]' lean/MCore/B01O1ConductorBridge.lean; then exit 1; fi
          printf 'import MCore.B01O1ConductorBridge\n#print axioms MCore.b01_o1_from_genuine_multiplicative_conductor_theorem\n' > B01O1AxiomAudit.lean
          lake env lean B01O1AxiomAudit.lean 2>&1 | tee B01O1AxiomAudit.log
          # Standard Lean/Mathlib foundations (propext, Classical.choice, Quot.sound)
          # are permitted; only unsound project proof holes are forbidden here.
          if grep -E 'sorryAx' B01O1AxiomAudit.log; then exit 1; fi
