name: BEAL open math inhabitants

on:
  push:
    branches:
      - attack/beal-open-math-inhabitants-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  open-math:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: t36e_mathlib
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Hygiene
        run: |
          set -euo pipefail
          for f in lean/MCore/BealOpenMathInhabitants.lean lean/MCore/B01ScientificInhabitant.lean lean/MCore/B01DenseScientificFrontier.lean lean/MCore/B02DenseScientificFrontier.lean lean/MCore/BealEndpointDenseFrontier.lean lean/MCore/BealDenseOpenMathPackage.lean; do
            if grep -n -E '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' "$f"; then exit 1; fi
            if grep -n -E '^[[:space:]]*(@\[[^]]*\][[:space:]]*)?(axiom|constant|constants)[[:space:]]' "$f"; then exit 1; fi
          done
      - name: Build final-chain dependency
        working-directory: t36e_mathlib
        run: |
          set -euo pipefail
          mkdir -p MCore
          cp ../lean/MCore/B01ExactConductorLevelCertificate.lean MCore/B01ExactConductorLevelCertificate.lean
          cp ../lean/MCore/BealFinalMathematicalChain.lean MCore/BealFinalMathematicalChain.lean
          lake build MCore.PostT36EConductorBridge MCore.B01ConductorLevel MCore.T58 MCore.K8 MCore.BealThreeLaneClosure
          lake env lean MCore/B01ExactConductorLevelCertificate.lean -o .lake/build/lib/lean/MCore/B01ExactConductorLevelCertificate.olean
          lake env lean MCore/BealFinalMathematicalChain.lean -o .lake/build/lib/lean/MCore/BealFinalMathematicalChain.olean
      - name: Kernel check exact inhabitants frontier
        working-directory: t36e_mathlib
        run: |
          set -euo pipefail
          cp ../lean/MCore/B01ScientificInhabitant.lean MCore/B01ScientificInhabitant.lean
          lake env lean MCore/B01ScientificInhabitant.lean -o .lake/build/lib/lean/MCore/B01ScientificInhabitant.olean 2>&1 | tee B01ScientificInhabitant.log
          if grep -F 'sorryAx' B01ScientificInhabitant.log; then exit 1; fi
          cp ../lean/MCore/B01DenseScientificFrontier.lean MCore/B01DenseScientificFrontier.lean
          lake env lean MCore/B01DenseScientificFrontier.lean -o .lake/build/lib/lean/MCore/B01DenseScientificFrontier.olean 2>&1 | tee B01DenseScientificFrontier.log
          if grep -F 'sorryAx' B01DenseScientificFrontier.log; then exit 1; fi
          cp ../lean/MCore/B02DenseScientificFrontier.lean MCore/B02DenseScientificFrontier.lean
          lake env lean MCore/B02DenseScientificFrontier.lean -o .lake/build/lib/lean/MCore/B02DenseScientificFrontier.olean 2>&1 | tee B02DenseScientificFrontier.log
          if grep -F 'sorryAx' B02DenseScientificFrontier.log; then exit 1; fi
          cp ../lean/MCore/BealEndpointDenseFrontier.lean MCore/BealEndpointDenseFrontier.lean
          lake env lean MCore/BealEndpointDenseFrontier.lean -o .lake/build/lib/lean/MCore/BealEndpointDenseFrontier.olean 2>&1 | tee BealEndpointDenseFrontier.log
          if grep -F 'sorryAx' BealEndpointDenseFrontier.log; then exit 1; fi
          cp ../lean/MCore/BealDenseOpenMathPackage.lean MCore/BealDenseOpenMathPackage.lean
          lake env lean MCore/BealDenseOpenMathPackage.lean -o .lake/build/lib/lean/MCore/BealDenseOpenMathPackage.olean 2>&1 | tee BealDenseOpenMathPackage.log
          if grep -F 'sorryAx' BealDenseOpenMathPackage.log; then exit 1; fi
          cp ../lean/MCore/BealOpenMathInhabitants.lean MCore/BealOpenMathInhabitants.lean
          lake env lean MCore/BealOpenMathInhabitants.lean 2>&1 | tee BealOpenMathInhabitants.log
          if grep -F 'sorryAx' BealOpenMathInhabitants.log; then exit 1; fi
      - name: Validate fail-closed state
        run: |
          python3 - <<'PY'
          import json
          x=json.load(open('CERTIFICATES/BEAL_OPEN_MATH_INHABITANTS.json'))
          y=json.load(open('CERTIFICATES/BEAL_B01_DENSE_FRONTIER.json'))
          z=json.load(open('CERTIFICATES/BEAL_DENSE_OPEN_MATH_PACKAGE.json'))
          assert x['proof_claimed'] is False
          assert x['refutation_claimed'] is False
          assert x['final_mathematical_certificate_issued'] is False
          assert x['promotion_allowed'] is False
          assert all(i['state']=='OPEN_MATH' for i in x['exact_remaining'])
          assert y['promotion_allowed'] is False
          assert y['proof_claimed'] is False
          assert all(i['state']=='OPEN_MATH' for i in y['obligations'])
          assert z['mathematical_state']=='OPEN_MATH'
          assert z['promotion_allowed'] is False
          assert z['proof_claimed'] is False
          assert z['refutation_claimed'] is False
          PY
      - name: Boundary
        run: |
          echo 'BEAL_OPEN_MATH_FRONTIER=GREEN_IF_JOB_SUCCEEDS'
          echo 'EXACT_REMAINING=3'
          echo 'FINAL_MATH_CERTIFICATE_ISSUED=false'
