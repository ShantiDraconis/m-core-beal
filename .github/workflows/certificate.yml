name: certificate
on: [push, pull_request]
jobs:
  k10:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain without implicit project build
        uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
      - name: G0 toolchain and fail-closed source hygiene
        run: |
          set -euo pipefail
          lean --version
          lake --version
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.19.0"
          if grep -R -n -E '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' --include='*.lean' lean; then exit 1; else rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; fi
          if grep -R -n -E '^[[:space:]]*(@\[[^]]*\][[:space:]]*)?(axiom|constant|constants)[[:space:]]' --include='*.lean' lean; then exit 1; else rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; fi
      - name: G1 preserve frozen K9 layer
        run: lake build MCore.K9.Core.Arith && lake build MCore.K9
      - name: G2 build K10 prime-divisor closure
        run: lake build MCore.K10
      - name: G3 K10 theorem-specific foundation audit
        run: |
          set -euo pipefail
          printf 'import MCore.K10\n#print axioms MCore.primeDivisorProperty_core\n#print axioms MCore.primeDivisorProperty_proved\n#print axioms MCore.commonPrime_iff_commonDivisor\n' > K10AxiomAudit.lean
          lake env lean K10AxiomAudit.lean 2>&1 | tee K10AxiomAudit.log
          if grep -E 'sorryAx|Classical\.choice' K10AxiomAudit.log; then exit 1; fi
          grep -F "'MCore.primeDivisorProperty_core' depends on axioms: [propext, Quot.sound]" K10AxiomAudit.log
          grep -F "'MCore.primeDivisorProperty_proved' depends on axioms: [propext, Quot.sound]" K10AxiomAudit.log
          grep -F "'MCore.commonPrime_iff_commonDivisor' depends on axioms: [propext, Quot.sound]" K10AxiomAudit.log
          echo 'K10 epistemic class: LEAN_STANDARD_FOUNDATION / CHOICE_FREE'
      - name: G4 K9 zero-axiom regression
        run: |
          printf 'import MCore.K10\n#print axioms MCore.K9.Core.mul_assoc_core\n#print axioms MCore.nat_dvd_trans\n#print axioms MCore.commonDivisor_to_commonPrime_of_primeDivisor\n#print axioms MCore.commonPrime_iff_commonDivisor_of_primeDivisor\n' > K9RegressionAudit.lean
          lake env lean K9RegressionAudit.lean 2>&1 | tee K9RegressionAudit.log
          for theorem in MCore.K9.Core.mul_assoc_core MCore.nat_dvd_trans MCore.commonDivisor_to_commonPrime_of_primeDivisor MCore.commonPrime_iff_commonDivisor_of_primeDivisor; do
            grep -F "'$theorem' does not depend on any axioms" K9RegressionAudit.log
          done
      - name: G5 endpoint remains non-promoted
        run: |
          printf 'import MCore.K10\nopen MCore\nexample : ¬ Nonempty (ProofCertificate bealEndpointNode) := k7_endpoint_not_certified\n' > NegativeK10.lean
          lake env lean NegativeK10.lean
      - name: G5A accepted-closure pipeline build
        run: |
          set -euo pipefail
          lake build MCore.BealAcceptedClosurePipeline
      - name: G5B accepted-closure foundation audit
        run: |
          set -euo pipefail
          printf 'import MCore.BealAcceptedClosurePipeline\n#print axioms MCore.acceptedClosureObject_closes_beal\n#print axioms MCore.finalRoot_closes_beal\n#print axioms MCore.finalRoot_refutation_exclusive\n#print axioms MCore.BealAcceptedClosurePipelineState_is_unresolved\n' > BealAcceptedClosureAxiomAudit.lean
          lake env lean BealAcceptedClosureAxiomAudit.lean 2>&1 | tee BealAcceptedClosureAxiomAudit.log
          if grep -E 'sorryAx|Classical\.choice' BealAcceptedClosureAxiomAudit.log; then exit 1; fi
          if grep -E 'depends on axioms:.*MCore\.' BealAcceptedClosureAxiomAudit.log; then exit 1; fi
          echo 'Accepted closure pipeline: SOURCE_GREEN candidate; no theorem inhabitant issued by CI.'
      - name: G5C negative promotion control
        run: |
          set -euo pipefail
          printf 'import MCore.BealAcceptedClosurePipeline\nopen MCore\nexample : BealAcceptedClosurePipelineState = .unresolved := BealAcceptedClosurePipelineState_is_unresolved\n' > BealAcceptedClosureNegative.lean
          lake env lean BealAcceptedClosureNegative.lean
          grep -F '"G4_EXTERNAL_CERTIFICATE": "BLOCKED_NO_INHABITANT"' CERTIFICATES/BEAL_ASSUMED_CLOSURE_PIPELINE.json
          grep -F '"G5_FINAL_ROOT": "BLOCKED_NO_INHABITANT"' CERTIFICATES/BEAL_ASSUMED_CLOSURE_PIPELINE.json
      - name: Backward oracle A-B test
        run: |
          set -euo pipefail
          lake build MCore.BackwardAudit.HypotheticalClosureOracle MCore.BackwardAudit.WithoutOracle
          for f in lean/MCore/BackwardAudit/HypotheticalClosureOracle.lean lean/MCore/BackwardAudit/WithoutOracle.lean; do
            if grep -n -E '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' "$f"; then exit 1; fi
            if grep -n -E '^[[:space:]]*(axiom|constant|constants)[[:space:]]' "$f"; then exit 1; fi
          done
          if grep -n -E 'HypotheticalClosure|HypotheticalClosureOracle' lean/MCore/BackwardAudit/WithoutOracle.lean; then exit 1; fi
          lake env lean lean/MCore/BackwardAudit/HypotheticalClosureOracle.lean 2>&1 | tee BackwardOracle.log
          lake env lean lean/MCore/BackwardAudit/WithoutOracle.lean 2>&1 | tee BackwardWithout.log
          if grep -F 'sorryAx' BackwardOracle.log BackwardWithout.log; then exit 1; fi
          grep -F "'MCore.BackwardAudit.hypothetical_common_prime' does not depend on any axioms" BackwardOracle.log
          grep -F "'MCore.BackwardAudit.witness_contract_closes_beal' does not depend on any axioms" BackwardWithout.log
      - name: G6 clean reproduction
        run: lake clean && timeout 20m lake build MCore
