name: certificate
on: [push, pull_request]
jobs:
  k7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: G0 fail-closed source hygiene
        run: |
          set -euo pipefail
          if grep -R -n -E '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' --include='*.lean' lean; then exit 1; else rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; fi
          if grep -R -n -E '^[[:space:]]*(@\[[^]]*\][[:space:]]*)?(axiom|constant|constants)[[:space:]]' --include='*.lean' lean; then exit 1; else rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; fi
      - {name: Preserve Beal core through K6, run: 'lake build MCore.BealSpecification && lake build MCore.GCDSignature && lake build MCore.DiscreteBoundary && lake build MCore.K6'}
      - {name: Build K7 actual endpoint firewall, run: 'lake build MCore.K7'}
      - name: K7 semantic axiom closure
        run: |
          printf 'import MCore.K7\n#print axioms MCore.k7_endpoint_status_open\n#print axioms MCore.k7_endpoint_not_proved\n#print axioms MCore.k7_endpoint_not_certified\n#print axioms MCore.certifyBeal\n' > K7AxiomAudit.lean
          lake env lean K7AxiomAudit.lean 2>&1 | tee K7AxiomAudit.log
          grep -F "'MCore.k7_endpoint_status_open' does not depend on any axioms" K7AxiomAudit.log
          grep -F "'MCore.k7_endpoint_not_proved' does not depend on any axioms" K7AxiomAudit.log
          grep -F "'MCore.k7_endpoint_not_certified' does not depend on any axioms" K7AxiomAudit.log
          grep -F "'MCore.certifyBeal' does not depend on any axioms" K7AxiomAudit.log
      - name: Negative K7 endpoint regression
        run: |
          printf 'import MCore.K7\nopen MCore\nexample : ¬ Nonempty (ProofCertificate bealEndpointNode) := k7_endpoint_not_certified\n' > NegativeK7.lean
          lake env lean NegativeK7.lean
      - name: G8 predictor remains non-promoting
        run: |
          python3 m_core/algebra_audit.py --target MCore.K7 --output k7_g8.json
          python3 - <<'PY'
          import json
          d=json.load(open('k7_g8.json'))
          assert d['automatic_promotion'] is False
          assert all(x['certNode_status']=='openBridge' for x in d['predicted_gaps'])
          assert all(x['formal_proof'] is False for x in d['predicted_gaps'])
          PY
      - {name: Clean reproduction, run: 'lake clean && lake build MCore.K7 && lake build MCore'}
