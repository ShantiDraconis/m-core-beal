name: certificate
on: [push, pull_request]
jobs:
  k8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: G0 fail-closed source hygiene
        run: |
          set -euo pipefail
          if grep -R -n -E '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' --include='*.lean' lean; then exit 1; else rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; fi
          if grep -R -n -E '^[[:space:]]*(@\[[^]]*\][[:space:]]*)?(axiom|constant|constants)[[:space:]]' --include='*.lean' lean; then exit 1; else rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; fi
      - {name: Preserve K7 GREEN kernel, run: 'lake build MCore.K7'}
      - {name: Build K8 constructive reduction, run: 'lake build MCore.K8'}
      - name: K8 semantic axiom closure
        run: |
          printf 'import MCore.K8\n#print axioms MCore.noCommonPrime_is_counterexample\n#print axioms MCore.beal_excludes_all_counterexamples\n#print axioms MCore.noCommonPrime_refutes_beal\n#print axioms MCore.closeBeal_from_commonPrime_witnesses\n' > K8AxiomAudit.lean
          lake env lean K8AxiomAudit.lean 2>&1 | tee K8AxiomAudit.log
          grep -F "'MCore.noCommonPrime_is_counterexample' does not depend on any axioms" K8AxiomAudit.log
          grep -F "'MCore.beal_excludes_all_counterexamples' does not depend on any axioms" K8AxiomAudit.log
          grep -F "'MCore.noCommonPrime_refutes_beal' does not depend on any axioms" K8AxiomAudit.log
          grep -F "'MCore.closeBeal_from_commonPrime_witnesses' does not depend on any axioms" K8AxiomAudit.log
      - name: Endpoint remains non-promoted
        run: |
          printf 'import MCore.K8\nopen MCore\nexample : ¬ Nonempty (ProofCertificate bealEndpointNode) := k7_endpoint_not_certified\n' > NegativeK8.lean
          lake env lean NegativeK8.lean
      - {name: Clean reproduction, run: 'lake clean && lake build MCore.K8 && lake build MCore'}
