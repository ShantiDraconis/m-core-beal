name: certificate
on: [push, pull_request]
jobs:
  k9:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: G0 fail-closed source hygiene
        run: |
          set -euo pipefail
          if grep -R -n -E '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' --include='*.lean' lean; then exit 1; else rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; fi
          if grep -R -n -E '^[[:space:]]*(@\[[^]]*\][[:space:]]*)?(axiom|constant|constants)[[:space:]]' --include='*.lean' lean; then exit 1; else rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; fi
      - {name: Preserve K8 GREEN kernel, run: 'lake build MCore.K8'}
      - {name: Build K9 prime-divisor bridge, run: 'lake build MCore.K9'}
      - name: K9 dependency diagnostics
        run: |
          printf 'import MCore.K9\n#print axioms Nat.mul_assoc\n#print axioms MCore.nat_dvd_trans\n#print axioms MCore.commonPrime_to_commonDivisor\n#print axioms MCore.commonDivisor_to_commonPrime_of_primeDivisor\n#print axioms MCore.commonPrime_iff_commonDivisor_of_primeDivisor\n' > K9DependencyAudit.lean
          lake env lean K9DependencyAudit.lean 2>&1 | tee K9DependencyAudit.log
      - name: K9 semantic axiom closure
        run: |
          printf 'import MCore.K9\n#print axioms MCore.commonDivisor_to_commonPrime_of_primeDivisor\n#print axioms MCore.commonPrime_iff_commonDivisor_of_primeDivisor\n' > K9AxiomAudit.lean
          lake env lean K9AxiomAudit.lean 2>&1 | tee K9AxiomAudit.log
          grep -F "'MCore.commonDivisor_to_commonPrime_of_primeDivisor' does not depend on any axioms" K9AxiomAudit.log
          grep -F "'MCore.commonPrime_iff_commonDivisor_of_primeDivisor' does not depend on any axioms" K9AxiomAudit.log
      - name: Prime-divisor property is not silently assumed
        run: |
          if grep -R -n -E '^[[:space:]]*axiom[[:space:]]+.*PrimeDivisorProperty' --include='*.lean' lean; then exit 1; fi
      - name: Endpoint remains non-promoted
        run: |
          printf 'import MCore.K9\nopen MCore\nexample : ¬ Nonempty (ProofCertificate bealEndpointNode) := k7_endpoint_not_certified\n' > NegativeK9.lean
          lake env lean NegativeK9.lean
      - {name: Clean reproduction, run: 'lake clean && lake build MCore.K9 && lake build MCore'}
