name: certify-k10
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/multistate-proof-refutation-v1
      - name: Install pinned Lean without implicit build
        uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
      - uses: actions/cache@v4
        with:
          path: |
            .lake/packages/mathlib/.lake/build
            .lake/packages/batteries/.lake/build
          key: lean-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml', 'lakefile.lean') }}
          restore-keys: |
            lean-${{ runner.os }}-
      - name: BUILD - clean K10 reproduction
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
          lake clean
          timeout 20m lake build MCore
          lake env lean lean/MCore/K10.lean
          echo "BUILD PASS"

  negative_control:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/multistate-proof-refutation-v1
      - name: Install pinned Lean without implicit build
        uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
      - name: NEGATIVE_CONTROL - choice footprint must be rejected
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/K10ChoiceContaminated.lean <<'EOF'
          import MCore.K10
          noncomputable def injectedChoice {α : Type} (h : Nonempty α) : α :=
            Classical.choice h
          #print axioms injectedChoice
          EOF
          lake env lean /tmp/K10ChoiceContaminated.lean 2>&1 | tee /tmp/k10-negative.log

          # The fixture itself MUST compile; the negative control is semantic,
          # not a deliberately malformed Lean file.
          grep -q 'Classical.choice' /tmp/k10-negative.log

          # Simulate the exact fail-closed foundation gate: choice contamination
          # must be rejected. If it is not visible, the negative control fails.
          if ! grep -q 'Classical.choice' /tmp/k10-negative.log; then
            echo "NEGATIVE_CONTROL FAIL - choice contamination escaped detection"
            exit 1
          fi
          echo "NEGATIVE_CONTROL PASS - choice contamination detected and rejected"
