name: Forced Beal Material Negative Control

on:
  push:
    branches:
      - atk/forced-material-negative-control-20261007
    paths:
      - 'lean/MCore/ForcedMaterialNegativeControl.lean'
      - '.github/workflows/forced-beal-material-negative-control.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  negative-control:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
      - name: Build dependency and run forced material
        run: |
          set -euo pipefail
          lake build MCore.BealDirectProducer
          lake env lean lean/MCore/ForcedMaterialNegativeControl.lean 2>&1 | tee ForcedMaterial.log
          grep -F 'sorryAx' ForcedMaterial.log
      - name: Fail closed on proof escape
        run: |
          set -euo pipefail
          if grep -n -E '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' lean/MCore/ForcedMaterialNegativeControl.lean; then
            echo "EXPECTED_RED: forced material contains a forbidden proof escape"
            exit 1
          fi
          echo "UNEXPECTED: negative control escaped hygiene"
          exit 2
