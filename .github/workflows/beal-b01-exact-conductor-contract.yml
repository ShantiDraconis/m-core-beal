name: BEAL B01 exact conductor contract

on:
  push:
    branches:
      - attack/beal-b01-exact-conductor-contract-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b01-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: t36e_mathlib
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Source hygiene
        run: |
          set -euo pipefail
          f=lean/MCore/B01ExactConductorLevelCertificate.lean
          if grep -n -E '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' "$f"; then exit 1; fi
          if grep -n -E '^[[:space:]]*(@\[[^]]*\][[:space:]]*)?(axiom|constant|constants)[[:space:]]' "$f"; then exit 1; fi
      - name: Build dependencies
        working-directory: t36e_mathlib
        run: |
          lake build MCore.PostT36EConductorBridge MCore.B01ConductorLevel
      - name: Kernel check B01 dense contract
        working-directory: t36e_mathlib
        run: |
          set -euo pipefail
          cp ../lean/MCore/B01ExactConductorLevelCertificate.lean MCore/B01ExactConductorLevelCertificate.lean
          lake env lean MCore/B01ExactConductorLevelCertificate.lean 2>&1 | tee B01ExactConductorLevelCertificate.log
          if grep -E 'sorryAx|Classical\.choice' B01ExactConductorLevelCertificate.log; then exit 1; fi
      - name: Boundary
        run: |
          echo 'B01_CONTRACT=GREEN_IF_JOB_SUCCEEDS'
          echo 'B01_SCIENTIFIC_STATE=OPEN_BRIDGE'
          echo 'PROMOTION_ALLOWED=false'
