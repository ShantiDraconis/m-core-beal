name: atk-terminal-producer

on:
  push:
    branches:
      - attack/terminal-producer-20260921
      - attack/triple-gcd-equivalence-20260921
  workflow_dispatch:

jobs:
  beal-terminal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.19
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve project dependencies
        run: |
          lake update
      - name: Compile exact terminal reduction
        run: lake build MCore.Attack.TerminalProducer MCore.Attack.GCDTerminalProducer
      - name: Axiom audit
        run: |
          cat > /tmp/BealTerminalAudit.lean <<'EOF'
          import MCore.Attack.TerminalProducer
          import MCore.Attack.GCDTerminalProducer
          #print axioms MCore.Attack.bealConjecture_iff_universalCommonDivisor
          #print axioms MCore.Attack.commonDivisor_closes_tripleGCD_gt_one
          #print axioms MCore.Attack.bealConjecture_iff_universalTripleGCDLowerBound
          EOF
          lake env lean /tmp/BealTerminalAudit.lean 2>&1 | tee /tmp/beal-terminal.log
          if grep -E 'sorryAx|Classical.choice' /tmp/beal-terminal.log; then exit 1; fi
      - name: Keep endpoint open
        run: |
          grep -q 'OPEN_MATH: prove UniversalTripleGCDLowerBound' lean/MCore/Attack/GCDTerminalProducer.lean
          echo "BEAL_TERMINAL_COMPRESSION=GREEN_IF_BUILD_PASSES"
          echo "BEAL_PROOF=OPEN"
