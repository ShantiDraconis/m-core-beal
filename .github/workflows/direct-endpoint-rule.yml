name: Direct Endpoint Rule Guard

on:
  push:
  pull_request:

jobs:
  policy-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify locked universal policy
        shell: bash
        run: |
          set -euo pipefail
          POLICY="POLICY/DIRECT_ENDPOINT_RULE.md"
          LEAN="formal/DirectEndpointRule.lean"
          test -f "$POLICY"
          test -f "$LEAN"
          test "$(git hash-object "$POLICY")" = "4c6ceec5c830128272bc9af7cbc399d219a4c1d9"
          test "$(git hash-object "$LEAN")" = "cdd2f392e9f5bca823291b005ee831573cb6e4c2"
      - name: Fail closed on proof placeholders in direct endpoint rule
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '\b(sorry|admit|axiom)\b' formal/DirectEndpointRule.lean; then
            echo "DIRECT_ENDPOINT_RULE rejected: placeholder/axiom detected"
            exit 1
          fi
