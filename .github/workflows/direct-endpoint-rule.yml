name: Direct Endpoint Rule Guard

on:
  push:
  pull_request:

jobs:
  policy-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify locked universal policy
        shell: bash
        run: |
          set -euo pipefail
          POLICY="POLICY/DIRECT_ENDPOINT_RULE.md"
          LEAN="formal/DirectEndpointRule.lean"
          test -f "$POLICY"
          test -f "$LEAN"
          echo "7ebc74aa23ecb851c6a2ba47fd717e957210adb9a9d77ae08051cedc9efa0703  $POLICY" | sha256sum -c -
          echo "0e98342baa2d29d8ccf24574a4fc45498ed4a8f955eee91a298364c39d255588  $LEAN" | sha256sum -c -
      - name: Fail closed on proof placeholders in direct endpoint rule
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '\b(sorry|admit|axiom)\b' formal/DirectEndpointRule.lean; then
            echo "DIRECT_ENDPOINT_RULE rejected: placeholder/axiom detected"
            exit 1
          fi
