name: ATK BEAL producer kernel

on:
  push:
    branches:
      - atk/producer-beal-20260928
  workflow_dispatch:

permissions:
  contents: read

jobs:
  producer:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        working-directory: t36e_mathlib
        run: lake update
      - name: Build exact producer frontier
        working-directory: t36e_mathlib
        run: lake build MCore.PostT36EConductorBridge
      - name: Reject proof escapes in producer sources
        run: |
          set -euo pipefail
          PAT='(:=[[:space:]]*sorry([^[:alnum:]_]|$)|by[[:space:]]+sorry([^[:alnum:]_]|$)|^[[:space:]]*sorry([^[:alnum:]_]|$)|(^|[^[:alnum:]_])admit([^[:alnum:]_]|$)|^[[:space:]]*(axiom|constant|constants)[[:space:]])'
          if grep -nE "$PAT" "lean/MCore/PostT36EConductorBridge.lean"; then
            echo "producer proof escape found"
            exit 1
          fi
