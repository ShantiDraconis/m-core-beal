name: beal-producer-router

on:
  push:
    branches:
      - attack/beal-b01-o1-conductor-bridge-20260926
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
      - name: Build Beal producer router
        run: |
          set -euo pipefail
          lake build MCore.BealFastExternalEndpoint
          lake env lean lean/MCore/BealProducer.lean 2>&1 | tee BealProducer.log
          if grep -n -E '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' lean/MCore/BealProducer.lean; then exit 1; fi
          if grep -n -E '^[[:space:]]*(axiom|constant|constants)[[:space:]]' lean/MCore/BealProducer.lean; then exit 1; fi
          if grep -E 'sorryAx' BealProducer.log; then exit 1; fi
