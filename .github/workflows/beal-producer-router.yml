name: beal-producer-router

on:
  push:
    branches:
      - attack/beal-b01-o1-conductor-bridge-20260926
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: Build Beal producer router
        run: |
          set -euo pipefail
          lake env lean lean/MCore/BealProducer.lean
          if grep -n -E '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' lean/MCore/BealProducer.lean; then exit 1; fi
          if grep -n -E '^[[:space:]]*(axiom|constant|constants)[[:space:]]' lean/MCore/BealProducer.lean; then exit 1; fi
          printf 'import MCore.BealProducer\n#print axioms MCore.producer_closes_beal\n#print axioms MCore.producer_cover_closes_beal\n' > BealProducerAxiomAudit.lean
          lake env lean BealProducerAxiomAudit.lean 2>&1 | tee BealProducerAxiomAudit.log
          if grep -E 'sorryAx' BealProducerAxiomAudit.log; then exit 1; fi
