name: post-t36e-conductor-bridge
on:
  push:
    branches: [attack/post-t36e-conductor-level-v2-20260920]
    paths:
      - 'lean/MCore/PostT36EConductorBridge.lean'
      - 'lean/MCore/T36E_MASTER.lean'
      - 'lean/MCore/T60.lean'
      - 'lean/MCore/KernelLocalFactorFromMultiplicative.lean'
      - 't36e_mathlib/**'
      - '.github/workflows/post-t36e-conductor-bridge.yml'
  pull_request:
    paths:
      - 'lean/MCore/PostT36EConductorBridge.lean'
      - 'lean/MCore/T36E_MASTER.lean'
      - 'lean/MCore/T60.lean'
      - 't36e_mathlib/**'
      - '.github/workflows/post-t36e-conductor-bridge.yml'

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Mathlib master environment
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: t36e_mathlib
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: G0 fail-closed hygiene
        run: |
          set -euo pipefail
          test "$(cat t36e_mathlib/lean-toolchain)" = "leanprover/lean4:v4.35.0-rc2"
          test "$(git -C t36e_mathlib/.lake/packages/mathlib rev-parse HEAD)" = "6ebcdee77a1b7bf10f211d4c993d85fbb19644bc"
          if grep -n -E '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' lean/MCore/PostT36EConductorBridge.lean; then exit 1; else rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; fi
          if grep -n -E '^[[:space:]]*(@\[[^]]*\][[:space:]]*)?(axiom|constant|constants)[[:space:]]' lean/MCore/PostT36EConductorBridge.lean; then exit 1; else rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; fi
      - name: G1 compile bridge
        working-directory: t36e_mathlib
        run: |
          set -euo pipefail
          lake build MCore.PostT36EConductorBridge 2>&1 | tee PostT36EConductorBridge.log
          if grep -F 'sorryAx' PostT36EConductorBridge.log; then exit 1; fi
      - name: G2 endpoint remains non-promoted
        run: |
          set -euo pipefail
          ! grep -F 'import MCore.PostT36EConductorBridge' lean/MCore.lean
          echo "POST_T36E_NOT_IMPORTED=PASS"
