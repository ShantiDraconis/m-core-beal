name: ATK terminal auto-compose
on:
  push:
    branches: [atk/auto-compose-terminal-20260930]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Beal/Mathlib environment
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: t36e_mathlib
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Minimal proof escape guard
        run: |
          set -euo pipefail
          ! grep -nE '^[[:space:]]*(sorry|admit|axiom)[[:space:]]' lean/MCore/AutoCompose.lean
      - name: Build composition and terminal frontier
        working-directory: t36e_mathlib
        run: |
          set -euo pipefail
          lake env lean ../lean/MCore/AutoCompose.lean
          lake build MCore.BealOpenMathInhabitants
