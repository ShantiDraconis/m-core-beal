name: t36e-master-proof
on:
  push:
    branches: [attack/t36e-mathlib-master]
  pull_request:
    paths:
      - 'lean/MCore/T36E_MASTER.lean'
      - 't36e_mathlib/**'
      - '.github/workflows/t36e-master-proof.yml'

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Mathlib master environment
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: t36e_mathlib
          build: false
          test: false
          lint: false
          use-mathlib-cache: true

      - name: G0 pins and proof hygiene
        run: |
          set -euo pipefail
          test "$(cat t36e_mathlib/lean-toolchain)" = "leanprover/lean4:v4.35.0-rc2"
          test "$(git -C t36e_mathlib/.lake/packages/mathlib rev-parse HEAD)" = "6ebcdee77a1b7bf10f211d4c993d85fbb19644bc"
          if grep -n -E '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' lean/MCore/T36E_MASTER.lean; then exit 1; else rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; fi
          if grep -n -E '^[[:space:]]*(@\[[^]]*\][[:space:]]*)?(axiom|constant|constants)[[:space:]]' lean/MCore/T36E_MASTER.lean; then exit 1; else rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; fi

      - name: G1 compile T36E master proof
        working-directory: t36e_mathlib
        run: |
          set -euo pipefail
          lake env lean ../lean/MCore/T36E_MASTER.lean 2>&1 | tee T36E_MASTER.log
          if grep -F 'sorryAx' T36E_MASTER.log; then exit 1; fi

      - name: G2 endpoint remains non-promoted
        run: |
          set -euo pipefail
          ! grep -F 'import MCore.T36E_MASTER' lean/MCore.lean
          echo "T36E_MASTER_NOT_IMPORTED=PASS"
